<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family: Arial;
background:#f2f4f7;
text-align:center;
padding:30px;
}

.card{
background:white;
max-width:500px;
margin:auto;
padding:25px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2{
margin-bottom:20px;
}

input{
width:80%;
padding:12px;
font-size:18px;
border-radius:6px;
border:1px solid #ccc;
}

button{
margin-top:15px;
padding:12px 25px;
font-size:18px;
background:#06c755;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#05b34d;
}

.result{
margin-top:25px;
text-align:left;
font-size:18px;
}

.box{
background:#f7f7f7;
padding:15px;
border-radius:8px;
}

</style>

</head>

<body>

<div class="card">

<h2>ค้นหาเลขหนังสือ</h2>

<input id="search" placeholder="เช่น สนธ.02/24794">

<br>

<button onclick="search()">ค้นหา</button>

<div class="result" id="result"></div>

</div>

<script>

// ใส่ลิงก์ CSV ของ Google Sheet
const sheetURL = "ใส่ลิงก์ CSV";

async function search(){

let id = document.getElementById("search").value.trim().toLowerCase();

let res = await fetch(sheetURL);

let text = await res.text();

let rows = text.split("\n");

let found = "";

rows.forEach(r=>{

let col = r.split(",");

if(col[0] && col[0].toLowerCase().trim().includes(id)){

found += `
<div class="box">
<b>เลขหนังสือ:</b> ${col[0]} <br>
<b>วันที่:</b> ${col[1]} <br>
<b>จาก:</b> ${col[2]} <br>
<b>ถึง:</b> ${col[3]} <br>
<b>เรื่อง:</b> ${col[4]}
</div>
<br>
`;

}

});

if(found==""){

found="<b>ไม่พบข้อมูล</b>";

}

document.getElementById("result").innerHTML = found;

}

// กด Enter เพื่อค้นหา
document.getElementById("search").addEventListener("keypress",function(e){

if(e.key==="Enter"){

search();

}

});

</script>

</body>
</html>
